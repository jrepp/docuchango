summary: >-
  An ADR whose tags are out of order, mixed case and repeated. The schema
  rejects the mixed-case tag, so a dry run reports it; a fixing run
  normalizes, de-duplicates and sorts the list (FM-008), and a second fixing
  run changes nothing. tests/test_tags_fixes.py and
  tests/test_frontmatter_fixes.py check that the rewrite keeps the file's
  final newline.
messages:
