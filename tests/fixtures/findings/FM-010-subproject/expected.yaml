summary: >-
  A monorepo whose sub-project declares its own `project.id`. The sub-project's
  ADR carries the root project's id, so FM-010 must report it against
  `service-d` and leave the correctly-tagged root ADR alone. The value is not a
  placeholder, so it is never rewritten.
