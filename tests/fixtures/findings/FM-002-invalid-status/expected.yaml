summary: >-
  An ADR whose `status` is not one of the literals the ADR schema allows, so
  the per-type Pydantic model rejects the frontmatter.
messages:
  - "Frontmatter field 'status'"
  - "Input should be 'Proposed', 'Accepted', 'Implemented', 'Deprecated' or 'Superseded'"
# fixes/frontmatter.py only rewrites values it recognises as aliases of a legal
# status. An unrecognised value such as "Bogus" stays a report.
fixed: false
dry_run_exit_code: 1
exit_code: 1
