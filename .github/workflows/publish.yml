name: Publish to PyPI (manual)

# Manual, out-of-band publishing. Normal releases are fully automated by
# .github/workflows/release.yml (semantic-release on `main`, promoted to stable
# by manual dispatch), which
# also builds PyApp binaries and signs the distributions. See PUBLISHING.md.
#
# Use this workflow to:
# 1. Smoke-test packaging against TestPyPI from any branch
#    (Actions -> "Publish to PyPI (manual)" -> Run workflow -> environment: testpypi)
# 2. Re-publish an existing tag to PyPI if the automated publish step failed
#    (run it against the tag; environment: pypi)
#
# Note: a `release: published` trigger does NOT work here. Releases are created
# by release.yml with GITHUB_TOKEN, and events produced by GITHUB_TOKEN never
# trigger other workflows.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to publish to'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.16"

      - name: Set up Python
        run: uv python install 3.14

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: |
          uv tool run twine check dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event.inputs.environment == 'pypi'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/docuchango
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event.inputs.environment == 'testpypi'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/docuchango
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
