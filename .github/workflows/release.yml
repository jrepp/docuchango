name: Release

# Automated releases driven by python-semantic-release.
#
#   main  -> stable releases   (v1.19.0)   marked "latest" on GitHub
#   next  -> release candidates (v1.19.0-rc.1 -> PyPI 1.19.0rc1) marked "pre-release"
#
# Every push runs semantic-release. If the conventional commits since the last
# release warrant a version bump, this workflow tags, creates the GitHub
# release, publishes to PyPI via trusted publishing, builds PyApp binaries,
# signs the distributions with Sigstore, and attaches everything to the
# GitHub release. See PUBLISHING.md.
#
# NOTE: the GitHub release is created with GITHUB_TOKEN, which never triggers
# other workflows. That is why the binary/signing jobs live here rather than
# in a `release: published` workflow.

on:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release
    environment:
      name: pypi
      url: https://pypi.org/p/docuchango
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # IMPORTANT: mandatory for trusted publishing to PyPI
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # Store the current tag before running semantic-release
          OLD_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')"

          # Run semantic-release (uv tool run installs and runs in one step).
          # Branch -> channel mapping (stable vs. rc) lives in pyproject.toml
          # under [tool.semantic_release.branches.*].
          uv tool run python-semantic-release version --no-push

          # Check if a new tag was created
          NEW_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')"

          if [ "$BRANCH" = "main" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$OLD_TAG" = "$NEW_TAG" ]; then
            echo "No version change detected (tag: $NEW_TAG)"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped from $OLD_TAG to $NEW_TAG"
            git push origin "$BRANCH" --follow-tags
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          # Extract the changelog section for this version
          # The VERSION already includes 'v' prefix (e.g., v1.0.2 or v1.1.0-rc.1)
          # Escape regex metacharacters in VERSION for safe use in awk pattern
          ESCAPED_VERSION=$(printf '%s\n' "$VERSION" | sed -e 's/[]\\/$*.^[]/\\&/g')
          CHANGELOG_SECTION=$(awk "/^## ${ESCAPED_VERSION} /{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)

          # Fallback to generic message if changelog section is empty
          if [ -z "$CHANGELOG_SECTION" ]; then
            CHANGELOG_SECTION="Release ${VERSION}"
          fi

          # Write changelog section to a temporary file to safely handle multiline content
          NOTES_FILE=$(mktemp)
          printf "%s\n" "$CHANGELOG_SECTION" > "$NOTES_FILE"

          # Release candidates are flagged as pre-releases and never become "latest"
          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_FLAGS=(--prerelease)
          else
            RELEASE_FLAGS=(--latest)
          fi

          # Create GitHub release with changelog
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "$NOTES_FILE" \
            "${RELEASE_FLAGS[@]}"

          # Clean up temporary file
          rm -f "$NOTES_FILE"

      - name: Build distribution packages
        if: steps.release.outputs.released == 'true'
        run: uv build

      - name: Check package metadata
        if: steps.release.outputs.released == 'true'
        run: uv tool run twine check dist/*

      - name: Store the distribution packages
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          packages-dir: dist/

  build-pyapp-binaries:
    name: Build PyApp binaries
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: docuchango-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: docuchango-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: docuchango-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download PyApp
        run: |
          git clone --depth 1 --branch v0.29.0 https://github.com/ofek/pyapp.git pyapp-src
        shell: bash

      - name: Build PyApp binary
        env:
          PYAPP_PROJECT_NAME: docuchango
          PYAPP_EXEC_MODULE: docuchango.cli:main
          PYAPP_PYTHON_VERSION: "3.14"
          VERSION_TAG: ${{ needs.release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          # Strip 'v' prefix from version tag; pip normalizes 1.1.0-rc.1 -> 1.1.0rc1
          export PYAPP_PROJECT_VERSION="${VERSION_TAG#v}"
          cd pyapp-src
          cargo build --release --target "$TARGET"
        shell: bash

      - name: Rename binary
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "pyapp-src/target/${TARGET}/release/pyapp.exe" "$ARTIFACT_NAME"
          else
            mv "pyapp-src/target/${TARGET}/release/pyapp" "$ARTIFACT_NAME"
          fi
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pyapp-binary-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  release-assets:
    name: Sign and attach release assets
    needs:
      - release
      - build-pyapp-binaries
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # IMPORTANT: mandatory for uploading GitHub Release assets
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Download PyApp binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: pyapp-binary-*
          path: binaries/
          merge-multiple: true

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Upload dists, signatures and binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          REPO: ${{ github.repository }}
        # `dist/` contains the built packages plus the sigstore-produced
        # signature bundles. Use --clobber to replace existing assets.
        run: |
          gh release upload "$VERSION" dist/* binaries/* --clobber --repo "$REPO"
